# npmjs.com trusted publishing (GitHub OIDC) -- no NPM_TOKEN anywhere.
# Lifted from luhtech/site-template's publish.yml (GTM-L3 G1.4-R), which
# publishes @luhtech/site-template this way. Trusted publishing needs an
# existing version on npmjs (0.3.0, published manually) and a trusted
# publisher configured on the package (npmjs.com -> package settings ->
# Trusted Publisher: GitHub Actions, Ectropy-ai / construction-commercial-
# context, workflow publish.yml). A tag v<version> matching package.json
# publishes that version.
#
# No `registry-url` on setup-node: it writes an _authToken line to .npmrc
# that makes npm skip the OIDC exchange (site-template found this live:
# IDENTITY_TOKEN_READ_ERROR). publishConfig.registry already targets npmjs.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    # Must equal the environment named on the npm trusted publisher
    # (package settings -> Trusted Publisher: construction-commercial); npm
    # rejects an OIDC token whose environment claim differs.
    environment: construction-commercial
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install -g npm@latest        # trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${PKG}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${PKG}"
            exit 1
          fi
      - run: pnpm run typecheck
      - run: pnpm test
      - run: npm publish --provenance --access public   # no NODE_AUTH_TOKEN: OIDC
